# Runs on every push and pull request: formatting and static checks, the Go
# unit/integration suite with the race detector, the web UI build (tsc -b +
# vite — plain `tsc --noEmit` checks nothing in this repo), and the hermetic
# end-to-end suite against the real gateway image.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal test)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./test/...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # bubblewrap lets the shell-sandbox tests run; they skip themselves
      # where the runner forbids unprivileged user namespaces.
      - name: install bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -yq bubblewrap
      - name: tests (race)
        run: ./run_tests.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: end-to-end (hermetic docker)
        run: ./scripts/e2e.sh --logs
